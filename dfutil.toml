# ── Zellij plugins ───────────────────────────────────────────────────────────
# Each .wasm is linked to <prefix>/share/zellij/plugins, where config.kdl loads
# it from a local file. post_install pre-approves the plugin's permission
# scopes (see scripts/zellij-seed-permissions.sh). If a plugin bump asks for
# new scopes, update the list in its post_install.

[tools.zellij-autolock]
description = "Locks Zellij while a trigger process has focus"
category = "zellij"
repo = "fresh2dev/zellij-autolock"
pin = "tag:0.3.0"
assets.any = "zellij-autolock.wasm"
links = { "share/zellij/plugins/zellij-autolock.wasm" = "zellij-autolock.wasm" }
post_install = "sh scripts/zellij-seed-permissions.sh zellij-autolock.wasm ReadApplicationState ChangeApplicationState"

# TEMPORARY fork. Upstream is dj95/zjstatus at v0.25.0.
[tools.zjstatus]
description = "Zellij status bar"
category = "zellij"
repo = "myah-mitchell/zjstatus"
pin = "tag:fork-v0.25.1"
assets.any = "zjstatus.wasm"
links = { "share/zellij/plugins/zjstatus.wasm" = "zjstatus.wasm" }
post_install = "sh scripts/zellij-seed-permissions.sh zjstatus.wasm ReadApplicationState ChangeApplicationState RunCommands"

# Installed and granted, but config.kdl does not load it.
[tools.zellij-newtab-plus]
description = "Floating new-tab picker with zoxide"
category = "zellij"
repo = "AlexZasorin/zellij-newtab-plus"
pin = "tag:v0.6.0"
assets.any = "zellij-newtab-plus.wasm"
links = { "share/zellij/plugins/zellij-newtab-plus.wasm" = "zellij-newtab-plus.wasm" }
post_install = "sh scripts/zellij-seed-permissions.sh zellij-newtab-plus.wasm RunCommands Reconfigure ReadApplicationState ChangeApplicationState"

# A * prefix pin skips the bump-PR review, so check new releases for added
# permission scopes by hand.
[tools.zjhints]
description = "Zellij keybinding hints bar"
category = "zellij"
repo = "myah-mitchell/zjhints"
pin = "ea-v0.6.0-*"
assets.any = "zjhints.wasm"
links = { "share/zellij/plugins/zjhints.wasm" = "zjhints.wasm" }
post_install = "sh scripts/zellij-seed-permissions.sh zjhints.wasm ReadApplicationState MessageAndLaunchOtherPlugins RunActionsAsUser ChangeApplicationState OpenTerminalsOrPlugins"

# Ships in zjhints' releases. Installed but not loaded by any layout yet, and
# install.sh has no permissions entry for it either.
[tools.zjtabs]
description = "Zellij tab bar (not loaded yet)"
category = "zellij"
repo = "myah-mitchell/zjhints"
pin = "ea-v0.6.0-*"
assets.any = "zjtabs.wasm"
links = { "share/zellij/plugins/zjtabs.wasm" = "zjtabs.wasm" }

# ── zsh plugins ──────────────────────────────────────────────────────────────
# These repos publish tags but no GitHub Releases, so the github kind cannot see
# them. Each is a repo-less script tool with the tag in its install command, so
# a bump changes the recipe and triggers a reinstall. The plugin ends up at
# <prefix>/share/zsh/plugins/<name>, the path .zshrc already sources.

[tools.zsh-autosuggestions]
description = "Fish-style autosuggestions"
category = "shell"
kind = "script"
install = "sh scripts/install-zsh-plugin.sh zsh-autosuggestions zsh-users/zsh-autosuggestions v0.7.1"
version = "echo v0.7.1"
uninstall = "rm -f \"$DFUTIL_PREFIX/share/zsh/plugins/zsh-autosuggestions\""

[tools.zsh-syntax-highlighting]
description = "Command-line syntax highlighting"
category = "shell"
kind = "script"
install = "sh scripts/install-zsh-plugin.sh zsh-syntax-highlighting zsh-users/zsh-syntax-highlighting 0.8.0"
version = "echo 0.8.0"
uninstall = "rm -f \"$DFUTIL_PREFIX/share/zsh/plugins/zsh-syntax-highlighting\""

[tools.zsh-you-should-use]
description = "Reminds you of aliases you have"
category = "shell"
kind = "script"
install = "sh scripts/install-zsh-plugin.sh zsh-you-should-use MichaelAquilina/zsh-you-should-use 1.11.1"
version = "echo 1.11.1"
uninstall = "rm -f \"$DFUTIL_PREFIX/share/zsh/plugins/zsh-you-should-use\""

# ── Themes ───────────────────────────────────────────────────────────────────
# Downloaded Catppuccin Mocha ports for bat, eza, and zsh-syntax-highlighting.
# They are Mocha only and do not follow [settings] palette.
[tools.catppuccin-themes]
description = "Catppuccin Mocha themes for bat, eza, zsh-syntax-highlighting"
category = "theme"
kind = "script"
install = "sh scripts/install-themes.sh"
version = "echo mocha"
requires = ["bat"]

[tools.jetbrainsmono-nerd-font]
description = "JetBrainsMono Nerd Font (native Linux; WSL gets it from windows-setup)"
category = "theme"
kind = "script"
install = "sh scripts/install-nerd-font.sh"
version = "echo latest"
when = { os = "linux", wsl = false }

# ── Claude Code stack ────────────────────────────────────────────────────────
# Node comes from nodejs.org: nodejs/node's GitHub releases carry no binaries.
# A repo-less script tool reinstalls only when its recipe changes, so this
# tracks "latest LTS" at first install, not afterward.
[tools.node]
description = "Node.js LTS from nodejs.org"
category = "dev"
kind = "script"
install = "sh scripts/install-node.sh"
version = "\"$DFUTIL_TOOL_DIR/bin/node\" --version"
bins = ["node=bin/node", "npm=bin/npm", "npx=bin/npx"]

# Claude's own installer manages its launcher and updates itself.
[tools.claude]
description = "Claude Code, through its own installer"
category = "claude"
kind = "script"
install = "curl -fsSL https://claude.ai/install.sh | bash"
version = "claude --version | cut -d' ' -f1"

[tools.ccstatusline]
description = "Claude Code status line"
category = "claude"
kind = "npm"
pin = "2.2.34"
requires = ["node"]
# Keep installation.installedVersion in ccstatusline/.config/ccstatusline/settings.json
# in step with this pin.

[tools.claude-swap]
description = "Switch between Claude accounts"
category = "claude"
kind = "uv"
package = "claude-swap"
bins = ["cswap", "claude-swap"]
requires = ["uv"]

# ── Full IDE workstation ─────────────────────────────────────────────────────
[tools.pwsh]
description = "PowerShell, for the powershell_es LSP"
category = "dev"
repo = "PowerShell/PowerShell"
assets.linux-x86_64 = "powershell-*-linux-x64.tar.gz"
assets.linux-aarch64 = "powershell-*-linux-arm64.tar.gz"

# nvim reads this marker to enable its heavier Mason LSPs.
[tools.full-marker]
description = "Marker file that turns on nvim's heavier LSPs"
category = "dev"
kind = "script"
install = "mkdir -p \"$HOME/.local/state/dotfiles\" && touch \"$HOME/.local/state/dotfiles/full-install\""
version = "echo marker"
uninstall = "rm -f \"$HOME/.local/state/dotfiles/full-install\""

# ssh/.ssh/config multiplexes through ControlPath ~/.ssh/sockets, and ssh
# fails to connect when that directory is missing.
[tools.ssh-dirs]
description = "~/.ssh and the ~/.ssh/sockets ControlPath directory"
category = "system"
kind = "script"
install = "mkdir -p \"$HOME/.ssh/sockets\" && chmod 700 \"$HOME/.ssh\" \"$HOME/.ssh/sockets\""
version = "echo dirs"

# ── WSL2 ─────────────────────────────────────────────────────────────────────
[tools.windows-setup]
description = "Alacritty, font, and config link on the Windows side"
category = "system"
kind = "script"
install = "bash scripts/windows-setup.sh"
version = "echo installed"
when = { wsl = true }

# ── Nushell ──────────────────────────────────────────────────────────────────
[tools.nushell-extras]
description = "Catppuccin theme and empty secrets.nu for nushell"
category = "system"
kind = "script"
install = "sh scripts/install-nushell-extras.sh"
version = "echo mocha"

# ── Building from source ─────────────────────────────────────────────────────
# dfutil has no way to order the rustup bootstrap ahead of source builds, since
# `requires` pulls its target into every selection. Run `dfutil apply` twice
# on a host with no Rust toolchain, or install rustup first.
[tools.rustup]
description = "Rust toolchain bootstrap"
category = "dev"
kind = "script"
install = "curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --no-modify-path --quiet"
version = "\"$HOME/.cargo/bin/rustc\" --version | cut -d' ' -f2"
uninstall = "\"$HOME/.cargo/bin/rustup\" self uninstall -y"

[tools.cargo-clean-all]
description = "Deletes stale Cargo target dirs, on a weekly timer"
category = "dev"
kind = "cargo"
crate = "cargo-clean-all"
requires = ["rustup"]
post_install = "sh scripts/cargo-clean-all-timer.sh install"
uninstall = "sh scripts/cargo-clean-all-timer.sh remove"

