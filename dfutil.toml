# dfutil manifest for these dotfiles. It sits beside install.sh and does not
# replace it yet. See docs/dfutil-port.md for what maps to what and what does not.
#
# Asset globs are anchored: they must match the whole asset name. The patterns
# are the install.sh ones, so run `dfutil plan` to catch any that drift.

[settings]
presets = ["base"]
shells = ["zsh"]
palette = "mocha"

# ── Packages ─────────────────────────────────────────────────────────────────
# The `bin` package is left out on purpose. It is install.sh's own download
# target, and dfutil keeps tools under its own directories.

[packages.bash]
description = "bash startup files"

[packages.zsh]
description = "zsh startup files"

[packages.starship]
description = "Prompt config (templated from the palette)"

[packages.zellij]
description = "Zellij config (config.kdl is templated)"

[packages.nvim]
description = "Neovim (LazyVim) config"

[packages.git]
description = "git config and delta/difftastic setup"

[packages.ripgrep]
description = "ripgrep config"

[packages.bat]
description = "bat config"

[packages.yazi]
description = "yazi config"

[packages.atuin]
description = "atuin config"

[packages.lazygit]
description = "lazygit config"

[packages.tealdeer]
description = "tealdeer config"

[packages.ssh]
description = "ssh config"

[packages.alacritty]
description = "Alacritty config"

[packages.claude]
description = "Claude Code settings, hooks, skills, global CLAUDE.md"

[packages.ccstatusline]
description = "ccstatusline layout"

[packages.nushell]
description = "Nushell config"

# ── Core tools ───────────────────────────────────────────────────────────────
# dfutil manages its own binary, so `dfutil update` keeps it current. It can't
# link over a real file, so bootstrap from a copy outside ~/.local/bin (see
# the README quick start).
[tools.dfutil]
description = "Installs and updates these dotfiles"
category = "system"
repo = "myah-mitchell/dfutil"
assets.linux-x86_64 = "dfutil-*-x86_64-unknown-linux-musl.tar.gz"
assets.linux-aarch64 = "dfutil-*-aarch64-unknown-linux-musl.tar.gz"

[tools.starship]
description = "Shell prompt"
category = "shell"
repo = "starship/starship"
crate = "starship"
assets.linux-x86_64 = "starship-x86_64-unknown-linux-musl.tar.gz"
assets.linux-aarch64 = "starship-aarch64-unknown-linux-musl.tar.gz"
init.zsh = "starship init zsh"
init.bash = "starship init bash"
init.nushell = "starship init nu"

# TEMPORARY: the myah-mitchell fork, as in install.sh. The prefix pin tracks the
# fork's ea-v0.46.7 prerelease builds. Revert to upstream by changing repo and
# dropping the pin. The fork publishes only x86_64, so aarch64 fails at install
# time, same as install.sh.
[tools.zellij]
description = "Terminal multiplexer (fork)"
category = "zellij"
repo = "myah-mitchell/zellij"
crate = "zellij"
pin = "fork-ea-v0.46.7-*"
assets.linux-x86_64 = "zellij-x86_64-unknown-linux-musl.tar.gz"
assets.linux-aarch64 = "zellij-aarch64-unknown-linux-musl.tar.gz"

[tools.nu]
description = "Nushell binary"
category = "shell"
repo = "nushell/nushell"
crate = "nu"
assets.linux-x86_64 = "nu-*-x86_64*linux*musl*.tar.gz"
assets.linux-aarch64 = "nu-*-aarch64*linux*musl*.tar.gz"

