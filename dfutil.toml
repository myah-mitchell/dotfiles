[presets.claude]
description = "Claude Code stack"
extends = ["base"]
tools = ["claude", "node", "ccstatusline", "claude-swap"]

[presets.full]
description = "Full IDE workstation: PowerShell, heavy LSPs, Windows-side setup"
extends = ["claude"]
tools = ["pwsh", "full-marker", "windows-setup"]

[presets.windows]
description = "Windows-side setup under WSL2 (a no-op elsewhere)"
tools = ["windows-setup"]

[presets.nushell]
description = "Nushell as a secondary shell"
tools = ["nu", "nushell-extras"]
packages = ["nushell"]
shells = ["nushell"]

[presets.cargo]
description = "Build Rust tools from source, and clean stale target dirs weekly"
build = "source"
tools = ["rustup", "cargo-clean-all"]
