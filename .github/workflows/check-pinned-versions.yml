name: Check pinned package versions

# Tools in dfutil.toml with a floating pin (latest, a partial version, or a *
# tag prefix) already resolve upstream at install time, so they need no bump
# PR. This workflow covers the exact pins, which stay frozen until someone
# edits them: `tag:` and exact-version pins on github and npm tools, and the
# tags embedded in the zsh plugins' install commands. The plan job builds the
# matrix from dfutil.toml, so a new exact pin is covered without editing this
# file. Each bump also rewrites the matching pin in install.sh. Before merging,
# see the "Pinned-version checks" section of CLAUDE.md.

on:
  schedule:
    - cron: "0 6 * * 1" # weekly, Monday 06:00 UTC
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-26.04
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7

      - name: List exact pins in dfutil.toml
        id: matrix
        run: echo "matrix=$(python3 .github/scripts/pinned-tools.py)" >> "$GITHUB_OUTPUT"

  check:
    needs: plan
    if: needs.plan.outputs.matrix != '{"include":[]}'
    runs-on: ubuntu-26.04
    permissions:
      contents: write
      pull-requests: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7

      - name: Check ${{ matrix.name }}
        env:
          NAME: ${{ matrix.name }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: .github/scripts/check-pinned-version.sh

      - name: Open pull request
        if: env.VERSION_CHANGED == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          commit-message: "chore(deps): bump ${{ matrix.name }} to ${{ env.NEW_VERSION }}"
          title: "chore(deps): bump ${{ matrix.name }} from ${{ env.OLD_VERSION }} to ${{ env.NEW_VERSION }}"
          body: |
            Automated bump of the pinned `${{ matrix.name }}` version from `${{ env.OLD_VERSION }}` to `${{ env.NEW_VERSION }}`, opened by the `check-pinned-versions` workflow.

            ${{ env.REVIEW_NOTE }}

            ${{ env.CHANGELOG }}
          branch: bump/${{ matrix.name }}-${{ env.NEW_VERSION }}
          delete-branch: true
          labels: dependencies
