name: Check pinned package versions

# Everything install.sh downloads via download_release()'s /releases/latest
# lookup (nu, starship, zellij, bat, fd, rg, ...) already self-updates on
# every install.sh run, so no bump PR is needed for those. This workflow only
# covers the handful of *pinned* versions hardcoded in install.sh, which
# stay frozen until someone edits the string by hand: the ZELLIJ_PLUGINS
# release tags and the npm-pinned ccstatusline version. Before merging a bump,
# see the "Pinned-version checks" section of CLAUDE.md for why each is pinned.

on:
  schedule:
    - cron: "0 6 * * 1" # weekly, Monday 06:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  check:
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        # An exact-tag TOOL_PINS row gets an entry with kind: tool-release and
        # name: its dest. A * prefix row has no pin to bump, so it gets none.
        include:
          - name: zellij-autolock
            kind: github-release
            repo: fresh2dev/zellij-autolock
          # TEMPORARY: tracks the fork install.sh pins. Switch back to
          # dj95/zjstatus when install.sh does.
          - name: zjstatus
            kind: github-release
            repo: myah-mitchell/zjstatus
          - name: zellij-newtab-plus
            kind: github-release
            repo: AlexZasorin/zellij-newtab-plus
          - name: zjhints
            kind: github-release
            repo: myah-mitchell/zjhints
          - name: zellij
            kind: tool-release
            repo: myah-mitchell/zellij
          - name: ccstatusline
            kind: npm
            package: ccstatusline
    steps:
      - uses: actions/checkout@v7

      - name: Check ${{ matrix.name }}
        env:
          NAME: ${{ matrix.name }}
          KIND: ${{ matrix.kind }}
          REPO: ${{ matrix.repo }}
          PACKAGE: ${{ matrix.package }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: .github/scripts/check-pinned-version.sh

      - name: Open pull request
        if: env.VERSION_CHANGED == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          commit-message: "chore(install): bump ${{ matrix.name }} to ${{ env.NEW_VERSION }}"
          title: "chore(install): bump ${{ matrix.name }} from ${{ env.OLD_VERSION }} to ${{ env.NEW_VERSION }}"
          body: |
            Automated bump of the pinned `${{ matrix.name }}` version from `${{ env.OLD_VERSION }}` to `${{ env.NEW_VERSION }}`, opened by the `check-pinned-versions` workflow.

            ${{ env.REVIEW_NOTE }}

            ${{ env.CHANGELOG }}
          branch: bump/${{ matrix.name }}-${{ env.NEW_VERSION }}
          delete-branch: true
          labels: dependencies
